<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <link rel="canonical" href="https://casanalyser.com/" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Theme & Icons -->
    <meta name="theme-color" content="#080d20" />
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Casanalyser" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="z0eKp9jBLkSSHwkxmPvigvXzrN6XDgEJQ44yDYr4tdM" />

    <!-- SEO / Social -->
    <title>CasAnalyser - AI-Powered Portfolio Insights</title>
    <meta name="description" content="Upload your CAS PDF and get instant AI-powered mutual fund portfolio analysis, asset allocation insights, and actionable recommendations." />
    <meta name="application-name" content="CasAnalyser" />
    <meta property="og:title" content="CasAnalyser - AI Portfolio Insights" />
    <meta property="og:description" content="Upload your CAS PDF and get instant AI-powered portfolio analysis." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://casanalyser.com/" />
    <meta property="og:site_name" content="CasAnalyser" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CasAnalyser - AI-Powered Portfolio Insights" />
    <meta name="twitter:description" content="Upload your CAS PDF and get instant AI-powered mutual fund portfolio analysis, asset allocation insights, and actionable recommendations." />

    <!-- Microsoft tiles -->
    <meta name="msapplication-TileColor" content="#3b6fff" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- Only the 2 fonts actually used by the app, non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" />
    </noscript>

    <!-- Instant dark background + loading screen — renders before any JS -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: #080d20;
        color: #fff;
        font-family: 'Outfit', system-ui, sans-serif;
      }
      #root { min-height: 100%; }
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #080d20;
        z-index: 99999;
        gap: 20px;
        transition: opacity 0.3s ease;
      }
      #app-loader.hidden { opacity: 0; pointer-events: none; }
      #app-loader svg { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #app-loader-text {
        font-size: 14px;
        color: rgba(255,255,255,0.45);
        letter-spacing: 0.04em;
      }
    </style>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1677235596798016');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <!-- Inline loader: visible instantly, removed once React mounts -->
    <div id="app-loader" aria-label="Loading CasAnalyser">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="16" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
        <path d="M20 4 A16 16 0 0 1 36 20" stroke="url(#lg)" stroke-width="3" stroke-linecap="round"/>
        <defs>
          <linearGradient id="lg" x1="20" y1="4" x2="36" y2="20" gradientUnits="userSpaceOnUse">
            <stop stop-color="#3b6fff"/>
            <stop offset="1" stop-color="#9333ea"/>
          </linearGradient>
        </defs>
      </svg>
      <span id="app-loader-text">Loading CasAnalyser…</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Remove loader once React has painted -->
    <script>
      (function() {
        var loader = document.getElementById('app-loader');
        if (!loader) return;
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            loader.classList.add('hidden');
            setTimeout(function() { loader.remove(); }, 350);
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: false });
      })();
    </script>
  </body>
</html>
